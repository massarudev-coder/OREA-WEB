<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060511">
  <title>Entrar | OREA</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/js/login.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <a class="brand auth-brand" href="/" aria-label="Voltar para a vitrine OREA">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span><strong>OREA</strong><small>COSMIC VAULT</small></span>
    </a>
    <section class="auth-heading">
      <p class="eyebrow">PAINEL OREA</p>
      <h1>Bem-vindo de volta</h1>
      <p class="auth-subtitle">Entre para cuidar de uma coleção verdadeiramente fora deste mundo.</p>
    </section>
    <section class="auth-form-card">
      <form id="loginForm">
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="voce@exemplo.com" required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <div class="password-input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Sua senha" required>
            <button id="togglePassword" class="password-toggle" type="button" aria-controls="password" aria-pressed="false">Mostrar</button>
          </div>
        </div>
        <button id="submitButton" class="button button-primary" type="submit">Entrar no painel</button>
        <p id="loginMessage" class="form-message" role="status" aria-live="polite"></p>
      </form>
      <a class="back-link" href="/">← Voltar para a vitrine</a>
    </section>
    <p class="auth-caption">Acesso exclusivo para administradores</p>
  </main>
</body>
</html>
